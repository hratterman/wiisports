# Alternative to self-hosting with wsr-host (host/macmini/README.md): serve the built site from an
# R2 bucket through this Worker, with Cloudflare Access on the Worker's route. Upload web/dist to
# the bucket with `wrangler r2 object put` (or rclone), then `wrangler deploy` from this folder.
name = "wiisports"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[r2_buckets]]
binding = "GAME"
bucket_name = "wiisports"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "PhoneRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PhoneRoom"]
