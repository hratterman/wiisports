# Cloudflare deployment for the hosted build (see docs/hosting.md).
# web/tools/deploy_cloudflare.py fills in the bucket name and uploads the site.
name = "wiisports"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[r2_buckets]]
binding = "GAME"
bucket_name = "wiisports"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "PhoneRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PhoneRoom"]
